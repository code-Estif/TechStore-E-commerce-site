<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Stylized "T" with circuit circuit nodes -->
  <path d="M20 25H80M50 25V80" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  <path d="M50 45H75V60" stroke="#7C8DA4" stroke-width="6" stroke-linecap="round"/>
  <path d="M50 65H30V50" stroke="#7C8DA4" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Circuit Nodes -->
  <circle cx="80" cy="25" r="5" fill="#FFFFFF"/>
  <circle cx="20" cy="25" r="5" fill="#FFFFFF"/>
  <circle cx="50" cy="80" r="5" fill="#FFFFFF"/>
  <circle cx="75" cy="60" r="4" fill="#7C8DA4"/>
  <circle cx="30" cy="50" r="4" fill="#7C8DA4"/>
  
  <!-- Subtle Glow Effect (No Background) -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
</svg>
